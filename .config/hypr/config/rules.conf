layerrule {
  name = layerrule-1
  blur = on
  ignore_alpha = 0
  animation = gnomed
  match:namespace = swaync-notification-window
}



layerrule {
  name = layerrule-2
  blur = on
  ignore_alpha = 0
  match:namespace = nwg-dock
}



layerrule {
  name = layerrule-3
  blur = on
  ignore_alpha = 0
  match:namespace = gtk-layer-shell
}

#~ layerrule = animation popin 95%,wallpaper
layerrule {
  name = layerrule-4
  no_anim = on
  match:namespace = wallpaper
}



layerrule {
  name = layerrule-5
  blur = on
  ignore_alpha = 0
  animation = slide right
  match:namespace = swaync-control-center
}


layerrule {
  name = layerrule-6
  blur = on
  ignore_alpha = 0
  match:namespace = waybar
}


layerrule {
  name = layerrule-7
  blur = on
  ignore_alpha = 0
  match:namespace = nwg-drawer
}

# layerrule = dimaround,nwg-drawer

layerrule {
  name = layerrule-8
  no_anim = on
  match:namespace = hyprpicker
}

layerrule {
  name = layerrule-9
  animation = popin 95%
  match:namespace = selection
}


layerrule {
  name = layerrule-10
  blur = on
  ignore_alpha = 0
  dim_around = on
  match:namespace = rofi
}


windowrule {
  name = windowrule-1
  no_blur = on
  opacity = 1 override
  match:class = (easyeffects)
  match:float = 1
}


windowrule {
  name = windowrule-2
  float = on
  match:class = (xdg-desktop-portal-gtk)
}

# windowrulev2 = opacity 0.90 override,focus:0
# windowrulev2 = opacity 1 override,fullscreen:1
windowrule {
  name = windowrule-3
  tile = on
  workspace = 6
  match:class = (chatterino)
}


windowrule {
  name = windowrule-4
  float = on
  move = (1280) (64)
  size = 1280 800
  match:class = (Guake)
}


windowrule {
  name = windowrule-5
  no_anim = on
  match:class = (ueberzugpp)(.*)
}


windowrule {
  name = windowrule-6
  float = on
  size = 640 480
  match:class = (pywal)
}


windowrule {
  name = windowrule-7
  float = on
  match:class = (waypaper)
}

windowrule {
  name = windowrule-8
  float = on
  size = 1920 1080
  match:class = (org.gnome.NautilusPreviewer)
}

windowrule {
  name = windowrule-9
  float = on
  move = ((monitor_w*0.5)) ((monitor_h*0.5))
  size = 1280 720
  match:class = (Nemo-preview-start)
}

# windowrulev2 = minsize 1280 720, class:(Nemo-preview-start)
# windowrulev2 = maxsize 1280 720, class:(Nemo-preview-start)

# windowrulev2 = size 1920 1080, class:(Nemo-preview-start)

windowrule {
  name = windowrule-10
  float = on
  size = 640 360
  rounding = 4
  no_initial_focus = on
  move = ((monitor_w*1)-1618) ((monitor_h*1)-466)
  match:title = (Picture-in-Picture)
}


windowrule {
  name = windowrule-11
  float = on
  match:class = WallpaperPicker
}

windowrule {
  name = windowrule-12
  size = 1255 555
  match:class = (WallpaperPicker)
}


